<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>定位测试</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
<div id="out"></div><div id="diag" style="font-family:monospace;font-size:13px;margin:10px;padding:10px;background:#f0f0f0;"></div>
<div id="c1" style="width:800px;height:400px;"></div>
<div id="c2" style="width:800px;height:400px;"></div>
<div id="c3" style="width:800px;height:400px;"></div>
<script>
window.onload = function() {
  setTimeout(function() {
    var result = [];
    var data = [
      { quarter: "2023Q1", supply: 2.8, demand: 2.65, gap: -5.2 },
      { quarter: "2023Q2", supply: 3.0, demand: 2.88, gap: -3.8 },
      { quarter: "2023Q3", supply: 3.5, demand: 3.58, gap: -2.4 }
    ];

    // 测试A: 无任何mark，纯bar+line 双y轴
    try {
      var c = echarts.init(document.getElementById('c1'));
      c.setOption({
        xAxis: { type: 'category', data: data.map(d => d.quarter) },
        yAxis: [ { type: 'value' }, { type: 'value' } ],
        series: [
          { name: '供给量', type: 'bar', data: data.map(d => d.supply) },
          { name: '需求量', type: 'bar', data: data.map(d => d.demand) },
          { name: '缺口率', type: 'line', yAxisIndex: 1, data: data.map(d => d.gap) }
        ]
      });
      result.push('A. 纯双轴bar+line: 无异常');
    } catch (e) { result.push('A. 纯双轴bar+line 报错: ' + e.message); }

    // 测试B: markArea 两个点 [yAxis 0, yAxis 50]
    try {
      var chart = echarts.init(document.getElementById('c2'));
      chart.setOption({
        xAxis: { type: 'category', data: data.map(d => d.quarter) },
        yAxis: [ { type: 'value' }, { type: 'value' } ],
        series: [
          { name: '供给量', type: 'bar', data: data.map(d => d.supply) },
          { name: '需求量', type: 'bar', data: data.map(d => d.demand) },
          {
            name: '缺口率', type: 'line', yAxisIndex: 1, data: data.map(d => d.gap),
            markArea: { data: [[{ yAxis: 0 }, { yAxis: 50 }]] }
          }
        ]
      });
      result.push('B. markArea两点[yAxis0,50]: 无异常');
    } catch (e) { result.push('B. markArea两点 报错: ' + e.message); }

    // 测试C: markLine trend + symbol:'none' 在 series 层
    try {
      var chart = echarts.init(document.getElementById('c3'));
      chart.setOption({
        xAxis: { type: 'category', data: [2023, 2024, 2025] },
        yAxis: { type: 'value' },
        series: [{
          type: 'bar',
          data: [4.3, 12.0, 64.6],
          markLine: { data: [{ type: 'trend' }], symbol: 'none' }
        }]
      });
      result.push('C. bar+markLine trend: 无异常');
    } catch (e) { result.push('C. bar+markLine trend 报错: ' + e.message); }

    document.getElementById('diag').innerHTML = result.join('<br/>');
  }, 500);
};
</script>
</body>
</html>
